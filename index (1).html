<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Найдись — поиск пропавших людей и питомцев</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&display=swap">
<style>
:root{--o:#ff6a00;--bg:#fff;--fg:#000;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--fg:#fff;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--o);outline-offset:2px}
h1,h2,h3,.logo{font-family:Fraunces,Georgia,serif;margin:0;line-height:1.1}
.top{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 10px;max-width:460px;margin:0 auto}
.logo{font-size:26px;font-weight:900}
.ic{width:44px;height:44px;border:0;background:none;cursor:pointer;border-radius:50%;display:grid;place-content:center}
.ic i{display:block;width:24px;height:3px;background:var(--fg);margin:3px 0;border-radius:2px}
.ic.plus{background:var(--o);color:#000;font-size:28px;font-weight:700;line-height:1;border:3px solid var(--fg);width:40px;height:40px}
.stage{position:relative;max-width:460px;margin:0 auto;height:calc(100% - 56px);padding:0 12px 12px}
#deck{position:relative;height:100%}
.card{position:absolute;inset:0;border:3px solid var(--fg);border-radius:24px;overflow:hidden;background:var(--o);touch-action:pan-y;user-select:none;cursor:grab}
.card.back{transform:scale(.95) translateY(12px)}
.ph{position:absolute;inset:0}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.init{display:grid;place-items:center;height:100%;font:900 180px Fraunces,Georgia,serif;color:#000}
.info{position:absolute;top:0;left:0;right:0;background:var(--fg);color:var(--bg);padding:14px 16px 12px}
.info h2{font-size:30px;font-weight:900}
.info p{margin:3px 0;font-size:14px}
.info .f{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cnt{background:var(--o);color:#000;border-radius:999px;padding:1px 9px;font-weight:700}
.stamp{position:absolute;top:46%;padding:6px 14px;border:4px solid #000;border-radius:10px;font:900 26px system-ui;opacity:0;background:var(--o);color:#000}
.stamp.y{right:14px;transform:rotate(10deg)}.stamp.n{left:14px;background:var(--bg);color:var(--fg);border-color:var(--fg);transform:rotate(-10deg)}
.ctl{position:absolute;left:0;right:0;bottom:30px;display:flex;justify-content:center;gap:36px;z-index:5;pointer-events:none}
.rb{pointer-events:auto;width:54px;height:54px;border-radius:50%;border:3px solid var(--fg);cursor:pointer;display:grid;place-items:center}
.rb.no{background:var(--bg);color:var(--fg)}.rb.yes{background:var(--o);color:#000}
.rb svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.empty{border:3px solid var(--fg);border-radius:24px;padding:28px 20px;text-align:center;margin-top:20px}
.empty h2{margin-bottom:8px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:29}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);background:var(--fg);color:var(--bg);z-index:30;padding:calc(16px + env(safe-area-inset-top,0px)) 0 calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-102%);visibility:hidden;transition:transform .22s,visibility .22s;border-right:4px solid var(--o);overflow:auto}
#drawer.open{transform:none;visibility:visible}
.dh{padding:0 20px 14px}.dh .logo{font-size:28px}
.dr{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:2px solid var(--bg);padding:15px 20px;font-size:18px;font-weight:700;cursor:pointer;color:inherit}
.dr:hover,.dr:focus-visible{background:var(--o);color:#000}
.bd{background:var(--o);color:#000;border-radius:999px;padding:0 9px;font-size:14px}
#sheet{position:fixed;inset:0;background:var(--bg);color:var(--fg);z-index:20;overflow:auto;padding:env(safe-area-inset-top,0px) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sh{max-width:640px;margin:0 auto}
.sh header{display:flex;align-items:center;gap:10px;height:56px;position:sticky;top:0;background:var(--bg);z-index:2}
.sh h2{font-size:26px}
.btn{background:var(--o);color:#000;border:3px solid var(--fg);border-radius:999px;padding:10px 18px;font-weight:800;cursor:pointer}
.btn.alt{background:var(--bg);color:var(--fg)}
.btn.sm{padding:6px 14px;font-size:14px}
.btn[aria-pressed="true"]{background:var(--o);color:#000}
.in{display:grid;gap:12px;padding:4px 0}
.in label{display:grid;gap:4px;font-weight:700;font-size:14px}
.in input:not([type=checkbox]),.in select,.in textarea,.bar input{background:var(--bg);border:3px solid var(--fg);border-radius:12px;padding:10px 12px;font-weight:400}
.chk{display:flex!important;gap:8px;align-items:flex-start;font-weight:400!important}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px}
.rowc{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--bg);border:3px solid var(--fg);border-radius:16px;padding:8px;margin-bottom:10px;cursor:pointer}
.rowc[aria-pressed="true"]{background:var(--o);color:#000}
.th{width:56px;height:56px;border-radius:10px;overflow:hidden;background:var(--o);color:#000;display:grid;place-items:center;font:900 28px Fraunces,Georgia,serif;flex:none}
.th img{width:100%;height:100%;object-fit:cover}
.st{margin-left:auto;font-size:13px;font-weight:800;background:var(--o);color:#000;border-radius:999px;padding:2px 10px;flex:none}.st.ok{background:var(--fg);color:var(--bg)}
.note{border:3px solid var(--fg);border-radius:16px;padding:16px}
.chatg{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media(min-width:700px){.chatg{grid-template-columns:240px 1fr}}
.chm{border:3px solid var(--fg);border-radius:16px;padding:8px;min-height:240px;display:grid;grid-template-rows:1fr auto;gap:8px}
.msgs{display:grid;gap:6px;max-height:50vh;overflow:auto;align-content:start}
.msg{max-width:85%;padding:8px 12px;border-radius:14px;border:2px solid var(--fg)}
.msg.me{background:var(--o);color:#000;justify-self:end}
.chm input{background:var(--bg);border:3px solid var(--fg);border-radius:12px;padding:10px 12px}
dialog{border:3px solid var(--fg);border-radius:22px;padding:0;width:min(560px,94vw);max-height:92dvh;background:var(--bg);color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.big{aspect-ratio:4/3;background:var(--o);position:relative;overflow:hidden}.big img{width:100%;height:100%;object-fit:cover;display:block}.big .init{font-size:120px}
.x{position:absolute;top:10px;right:10px;z-index:2}
.dv{padding:16px;display:grid;gap:12px}
.sight{border-left:5px solid var(--o);padding:2px 12px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--o);color:#000;border:3px solid var(--fg);font-weight:700;padding:10px 18px;border-radius:14px;z-index:60;max-width:90vw}
.mut{font-size:14px}
@media (prefers-reduced-motion:reduce){#drawer{transition:none}}
/* v3: мягче, но те же три цвета */
.logo{font-size:28px}
.logo::after{content:"";display:inline-block;width:.3em;height:.3em;background:var(--o);border-radius:50%;margin-left:3px}
.ic.plus{border:0;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.card{border:0;border-radius:30px;box-shadow:0 12px 32px rgba(0,0,0,.3)}
.info{background:var(--o);color:#000;padding:16px 18px 14px}
.info h2{font-size:32px}
.cnt{background:#000;color:#fff}
.stamp{border-width:3px;border-radius:14px}
.rb{border:0;width:58px;height:58px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.rb.no{background:#fff;color:#000}
.empty{border:0;background:var(--o);color:#000;border-radius:28px}
#drawer{background:var(--bg);color:var(--fg);border-right:0;padding-top:0;box-shadow:8px 0 30px rgba(0,0,0,.3)}
.dh{background:var(--o);color:#000;padding:calc(20px + env(safe-area-inset-top,0px)) 20px 18px;margin-bottom:8px}
.dh .logo{color:#000}
.dr{border:0;border-radius:16px;margin:2px 10px;width:calc(100% - 20px);padding:14px}
.btn{border:2px solid var(--o)}
.btn.alt{border-color:var(--fg)}
.in input:not([type=checkbox]),.in select,.in textarea,.bar input,.chm input{border:2px solid var(--fg);border-radius:14px}
.rowc{border:2px solid var(--fg);border-radius:20px}
.th{border-radius:14px}
.note,.chm{border-width:2px;border-radius:22px}
dialog{border:0;border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.toast{border:0;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.dl{display:flex;align-items:center;gap:14px}
.dl svg{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn .dl{gap:8px;justify-content:center}
.btn .dl svg{width:20px;height:20px}
</style>
</head>
<body>
<header class="top"><button class="ic" id="menuBtn" aria-label="Меню" aria-expanded="false"><span><i></i><i></i><i></i></span></button><span class="logo">Найдись</span><button class="ic plus" id="addBtn" aria-label="Сообщить о пропаже">+</button></header>

<section id="sheet" hidden><div class="sh"><header><button class="btn alt sm" id="back">Назад</button><h2 id="shT"></h2></header><div id="shB"></div></div></section>

<dialog id="dAdd"><form class="dv" id="f" method="dialog">
<h2>Новое объявление</h2>
<div class="in"><div class="row"><label>Кто пропал<select name="kind" id="kind"><option value="pet">Питомец</option><option value="person">Человек</option></select></label><label id="spW">Вид<select name="species"><option>Собака</option><option>Кошка</option><option>Другое</option></select></label></div>

<div class="row"><label>Радиус<select name="radius"><option value="0.5">500 м</option><option value="1" selected>1 км</option><option value="3">3 км</option></select></label><label>Когда<input type="datetime-local" name="when" required></label></div>
<button type="button" class="btn alt sm" id="loc">Отметить моё местоположение</button><span class="mut" id="locS"></span>
<div class="in"><b style="font-size:14px">Фото</b><div class="row"><button type="button" class="btn alt" id="pickBtn">Загрузить фото</button><button type="button" class="btn alt" id="camBtn">Сделать снимок</button></div><img id="phPrev" alt="Предпросмотр фото" hidden style="width:100%;max-height:180px;object-fit:cover;border:3px solid var(--fg);border-radius:12px"><span class="mut" id="phS"></span></div><input type="file" accept="image/*" id="photo" tabindex="-1" style="position:absolute;width:1px;height:1px;opacity:0;border:0;padding:0;pointer-events:none"><input type="file" accept="image/*" capture="environment" id="photo2" tabindex="-1" style="position:absolute;width:1px;height:1px;opacity:0;border:0;padding:0;pointer-events:none">
<div class="row"><label>Ваше имя<input name="cname" required maxlength="60"></label><label>Телефон<input name="phone" type="tel" required maxlength="30"></label></div>

<label class="chk"><input type="checkbox" required> Я вправе публиковать это фото и данные, домашний адрес не указываю.</label></div>
<div class="row"><button type="button" class="btn alt" id="cancel">Отмена</button><button class="btn">Опубликовать</button></div>
<div class="mut" id="err" role="alert"></div></form></dialog>
<dialog id="dView"><div id="vBody"></div></dialog>
<div class="toast" id="toast" hidden role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* === РЕЖИМЫ ===

const SUPABASE_URL="https://jwqehnlxjtuqvhwyynco.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3cWVobmx4anR1cXZod3l5bmNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMTkwMjAsImV4cCI6MjEwNzg5NTAyMH0.coALxhEQavEJiVM8Evm3XDZ3GfTDI4zHFWiiNRFLCKU";

async function authUser(){let {data:{session}}=await sb.auth.getSession();if(!session){const r=await sb.auth.signInAnonymously();if(r.error)throw r.error;session=r.data.session}sb.auth.onAuthStateChange((ev,s)=>{if(ev==="SIGNED_IN"&&s&&uid&&s.user.id!==uid)location.reload()});return session.user}
const snapOf=r=>({id:r.id,exists:true,data:()=>r.data});
function Q(coll){return{c:coll,f:[],o:null,l:null,
 where(f,op,v){this.f.push([f,op,v]);return this},
 orderBy(f,d){this.o=[f,d||"asc"];return this},
 limit(n){this.l=n;return this},
 async get(){let q=sb.from("docs").select("id,data").eq("coll",this.c);
  for(const [f,op,v] of this.f)q=q.contains("data",{[f]:op==="array-contains"?[v]:v});

  const {data,error}=await q;if(error)throw error;const docs=data.map(snapOf);return{docs,size:docs.length,empty:!docs.length}},
 onSnapshot(cb,er,ms){let on=true,last=null;const run=async()=>{if(document.hidden&&last!==null)return;try{const s=await this.get(),k=JSON.stringify(s.docs.map(d=>[d.id,d.data()]));if(k!==last){last=k;on&&cb(s)}}catch(e){er&&er(e)}};run();const h=()=>run();addEventListener("ldocs",h);const t=setInterval(run,ms||30000);return()=>{on=false;clearInterval(t);removeEventListener("ldocs",h)}},
 async add(d){const id=crypto.randomUUID();await D(this.c+"/"+id).set(d);return{id}}}}
function D(path){const i=path.lastIndexOf("/"),coll=path.slice(0,i),id=path.slice(i+1);return{id,
 async get(){const {data,error}=await sb.from("docs").select("id,data").eq("coll",coll).eq("id",id).maybeSingle();if(error)throw error;return data?snapOf(data):{id,exists:false,data:()=>undefined}},
 async set(d){const {error}=await sb.from("docs").upsert({path,coll,id,data:d});if(error)throw error;pingL()},
 async update(p){const s=await this.get(),cur=s.exists?s.data():{};const {error}=await sb.from("docs").update({data:{...cur,...p}}).eq("path",path);if(error)throw error;pingL()},

const pingL=()=>dispatchEvent(new Event("ldocs"));
const LOCAL=!CFG_OK;
let ldocs={};try{ldocs=JSON.parse(localStorage.getItem("ldocs")||"{}")}catch(e){}
const lsave=()=>{try{localStorage.setItem("ldocs",JSON.stringify(ldocs))}catch(e){throw new Error("Память браузера заполнена")}};
function LQ(coll){return{c:coll,f:[],o:null,l:null,
 where(f,op,v){this.f.push([f,op,v]);return this},orderBy(f,d){this.o=[f,d||"asc"];return this},limit(n){this.l=n;return this},
 async get(){let a=Object.values(ldocs).filter(r=>r.coll===this.c);

  if(this.o){const [f,d]=this.o;a.sort((x,y)=>(x.data[f]>y.data[f]?1:x.data[f]<y.data[f]?-1:0)*(d==="desc"?-1:1))}
  if(this.l)a=a.slice(0,this.l);const docs=a.map(r=>snapOf({id:r.id,data:JSON.parse(JSON.stringify(r.data))}));return{docs,size:docs.length,empty:!docs.length}},
 onSnapshot(cb,er){let on=true,last=null;const run=async()=>{try{const s=await this.get(),k=JSON.stringify(s.docs.map(d=>[d.id,d.data()]));if(k!==last){last=k;on&&cb(s)}}catch(e){er&&er(e)}};run();const h=()=>run();addEventListener("ldocs",h);const t=setInterval(run,3000);return()=>{on=false;clearInterval(t);removeEventListener("ldocs",h)}},
 async add(d){const id=crypto.randomUUID();await LD(this.c+"/"+id).set(d);return{id}}}}
function LD(path){const i=path.lastIndexOf("/"),coll=path.slice(0,i),id=path.slice(i+1);return{id,
 async get(){const r=ldocs[path];return r?snapOf({id,data:JSON.parse(JSON.stringify(r.data))}):{id,exists:false,data:()=>undefined}},
 async set(d){ldocs[path]={coll,id,data:JSON.parse(JSON.stringify(d))};try{lsave()}catch(e){delete ldocs[path];throw e}pingL()},
 async update(p){const r=ldocs[path];ldocs[path]={coll,id,data:{...(r?r.data:{}),...p}};lsave();pingL()},
 async delete(){delete ldocs[path];lsave();pingL()}}}
const DB=CFG_OK?{collection:Q,doc:D}:{collection:LQ,doc:LD};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

 $("#mf").onsubmit=async e=>{e.preventDefault();const t=$("#mt").value.trim();if(!t||!curChat)return;$("#mt").value="";try{const now=Date.now();const cc=myChats.find(x=>x.id===curChat);if(!cc){toast("Чат ещё загружается, попробуйте через несколько секунд");return}await db.collection("chats/"+curChat+"/msgs").add({from:uid,text:t,at:now,members:cc.members});await db.doc("chats/"+curChat).update({lastAt:now,lastBy:uid})}catch(x){toast("Не удалось отправить: "+(x.message||x))}};
}
function selectChat(id){
 curChat=id;msgN=null;unsubM&&unsubM();const c=myChats.find(x=>x.id===id);if(c){seen[id]=c.lastAt||Date.now();persist()}
 $("#mf").hidden=false;
 unsubM=db.collection("chats/"+id+"/msgs").orderBy("at").onSnapshot(s=>{const m=$("#ml");if(!m)return;if(msgN!==null&&s.docs.length>msgN&&s.docs[s.docs.length-1].data().from!==uid&&sndOn)ding();msgN=s.docs.length;m.innerHTML=s.docs.length?s.docs.map(d=>{const v=d.data();return `<div class="msg ${v.from===uid?"me":""}"><div class="mut">${v.from===uid?"Вы":esc(pname(v.from))}</div>${esc(v.text)}</div>`}).join(""):'<span class="mut">Напишите первое сообщение.</span>';m.scrollTop=m.scrollHeight;seen[id]=Date.now();persist();bdg()},()=>{},3000);
 renderChats();
}
async function openChat(p){
 if(!uid||!db){toast("Нет связи с базой данных.");return}
 const id=p.id+"_"+uid;
 try{const r=db.doc("chats/"+id),s=await r.get();let c;if(s.exists)c=s.data();else{c={postId:p.id,postName:p.name,members:[p.authorId,uid],lastAt:Date.now(),lastBy:""};await r.set(c)}if(!myChats.some(x=>x.id===id))myChats.push({id,...c});$("#dView").close();openSheet("chats");selectChat(id)}catch(e){toast("Не удалось открыть чат")}
}

/* ---------- новое объявление ---------- */
let myLoc=null,photoData=null;
function openAdd(){const f=$("#f");f.reset();photoData=null;myLoc=null;$("#locS").textContent="";$("#phS").textContent="";$("#phPrev").hidden=true;$("#err").textContent="";const n=new Date();n.setMinutes(n.getMinutes()-n.getTimezoneOffset());f.when.value=n.toISOString().slice(0,16);$("#spW").hidden=false;$("#dAdd").showModal()}
$("#addBtn").onclick=openAdd;$("#cancel").onclick=()=>$("#dAdd").close();
$("#kind").onchange=e=>$("#spW").hidden=e.target.value==="person";
$("#loc").onclick=()=>getPos(p=>{myLoc=p;$("#locS").textContent=" Место отмечено"},$("#locS"));
function takePhoto(f){const st=$("#phS"),pv=$("#phPrev");photoData=null;pv.hidden=true;if(!f)return;st.textContent="Загружаем фото…";const rd=new FileReader();rd.onerror=()=>{st.textContent="Не удалось прочитать файл"};rd.onload=()=>{const im=new Image();im.onerror=()=>{st.textContent="Не удалось открыть фото. Попробуйте JPG или PNG."};im.onload=()=>{const k=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);photoData=c.toDataURL("image/jpeg",.72);pv.src=photoData;pv.hidden=false;st.textContent="Фото добавлено"};im.src=rd.result};rd.readAsDataURL(f)}
["#photo","#photo2"].forEach(s=>$(s).onchange=e=>takePhoto(e.target.files[0]));
const pick=s=>{const st=$("#phS");st.textContent="Открываем выбор файла…";try{$(s).value="";$(s).click()}catch(e){st.textContent="Браузер не даёт открыть выбор файла. Вставьте фото из буфера (Ctrl+V) или перетащите его на форму."}setTimeout(()=>{if(st.textContent.startsWith("Открываем"))st.textContent="Если окно выбора не открылось, проверьте разрешения браузера для этого сайта или откройте сайт в Safari или Chrome."},2500)};
$("#pickBtn").onclick=()=>pick("#photo");$("#camBtn").onclick=()=>pick("#photo2");
$("#f").addEventListener("paste",e=>{const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith("image/"));it&&takePhoto(it.getAsFile())});
$("#dAdd").addEventListener("dragover",e=>e.preventDefault());$("#dAdd").addEventListener("drop",e=>{e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];f&&f.type.startsWith("image/")&&takePhoto(f)});
$("#f").onsubmit=async e=>{e.preventDefault();const f=e.target,er=$("#err");
 if(!db){er.textContent="Нет связи с базой данных.";return}
 const d={kind:f.kind.value,species:f.kind.value==="pet"?f.species.value:"",name:f.name.value.trim(),age:f.age.value.trim(),features:f.features.value.trim(),place:f.place.value.trim(),radius:+f.radius.value,when:new Date(f.when.value).getTime(),photo:photoData||"",cname:f.cname.value.trim(),phone:f.phone.value.trim(),showPhone:f.showPhone.checked,code:genCode(),status:"searching",authorId:uid||"",createdAt:Date.now()};
 if(myLoc){d.lat=myLoc.lat;d.lng=myLoc.lng}
 try{const r=await db.collection("posts").add(d);if(r&&r.id){mine.add(r.id);persist()}$("#dAdd").close();toast("Объявление опубликовано. ID: "+d.code)}catch(x){er.textContent="Не удалось опубликовать. Возможно, нет прав на запись или фото слишком большое."}};

/* ---------- подробности ---------- */
const dV=$("#dView");dV.onclose=()=>{unsubS&&unsubS();unsubS=null};dV.onclick=e=>{if(e.target===dV)dV.close()};
function openView(p){
 const own=isOwn(p)||(user&&user.canEdit&&user.canEdit()),on=joined.has(p.id);
 $("#vBody").innerHTML=`<button class="btn alt sm x" id="vx">Закрыть</button><div class="big">${p.photo?`<img src="${esc(p.photo)}" alt="Фото: ${esc(p.name)}">`:`<div class="init">${ini(p)}</div>`}</div><div class="dv">
<h2>${esc(p.name)} <span class="st ${p.status==="found"?"ok":""}">${p.status==="found"?"Найден":"Ищем"}</span></h2><div class="mut">ID ${codeOf(p)}</div>
<div><b>${kindT(p)}</b>${p.age?", "+esc(p.age):""}</div>${p.features?`<div>${esc(p.features)}</div>`:""}
<div>Пропал(а): ${esc(p.place)} <span class="mut">(радиус ${p.radius<1?p.radius*1000+" м":p.radius+" км"}, ${ago(p.when||p.createdAt)})</span></div>
<div>${p.showPhone?`Контакт: ${esc(p.cname)}, <a href="tel:${esc(p.phone)}" style="color:inherit">${esc(p.phone)}</a>`:`Автор: ${esc(p.cname)}. Телефон скрыт, напишите сообщение ниже.`}</div>
<div class="row">${p.status==="found"?"":`<button class="btn" id="jn">${on?"Вы в поиске ✓":"Присоединиться к поиску"}</button>`}<button class="btn alt" id="seen">Я видел(а)</button>${p.authorId&&p.authorId!==uid?'<button class="btn alt" id="chat">Написать автору</button>':""}${p.authorId?'<button class="btn alt" id="prof">Страница автора</button>':""}<button class="btn alt" id="share">Поделиться</button>${own&&p.status!=="found"?'<button class="btn alt" id="found">Отметить найденным</button>':""}${own?'<button class="btn alt" id="delCard">Удалить карточку</button>':""}</div>
<form id="sf" hidden class="in"><label>Где и когда видели<input name="w" required maxlength="160"></label><label>Комментарий<textarea name="c" rows="2" maxlength="400"></textarea></label><button class="btn">Отправить</button></form>
<h3>Сообщения от людей</h3><div id="sl" class="in"><span class="mut">Пока нет сообщений.</span></div>
<button class="btn alt sm" id="rep" style="justify-self:start">Пожаловаться на объявление</button></div>`;
 dV.showModal();
 $("#vx").onclick=()=>dV.close();
 if($("#jn"))$("#jn").onclick=async()=>{joined.has(p.id)?await leave(p):await join(p);$("#jn").textContent=joined.has(p.id)?"Вы в поиске ✓":"Присоединиться к поиску";sig=""};
 $("#seen").onclick=()=>{$("#sf").hidden=false;$("#sf").w.focus()};
 if($("#chat"))$("#chat").onclick=()=>openChat(p);
 if($("#prof"))$("#prof").onclick=()=>{dV.close();openSheet("account",p.authorId)};
 $("#share").onclick=async()=>{const t=(p.status==="found"?"Найден: ":"Ищем: ")+p.name+", "+p.place+" (ID "+codeOf(p)+")";try{navigator.share?await navigator.share({title:t,text:t,url:location.href}):(await navigator.clipboard.writeText(t+" "+location.href),$("#share").textContent="Скопировано")}catch(e){}};
 if($("#found"))$("#found").onclick=async()=>{try{await db.doc("posts/"+p.id).update({status:"found"});dV.close()}catch(e){toast("Не удалось обновить статус")}};
 if($("#delCard"))twice($("#delCard"),"Нажмите ещё раз: удалить навсегда",async()=>{try{await db.doc("posts/"+p.id).delete();joined.delete(p.id);mine.delete(p.id);skipped.delete(p.id);persist();posts=posts.filter(x=>x.id!==p.id);sig="";dV.close();toast("Карточка удалена");renderDeck();if(sh)renderSheet()}catch(e){toast("Не удалось удалить карточку")}});
 $("#rep").onclick=async()=>{try{await db.collection("reports").add({postId:p.id,createdAt:Date.now()});$("#rep").textContent="Жалоба отправлена"}catch(e){$("#rep").textContent="Не удалось отправить"}};
 $("#sf").onsubmit=async e=>{e.preventDefault();const f=e.target;try{await db.collection("posts/"+p.id+"/sightings").add({where:f.w.value.trim(),comment:f.c.value.trim(),createdAt:Date.now()});f.reset();f.hidden=true}catch(x){toast("Не удалось отправить")}};
 if(db)unsubS=db.collection("posts/"+p.id+"/sightings").orderBy("createdAt","desc").onSnapshot(s=>{ss[p.id]=s.size;SV("ss",ss);if(s.empty)return;$("#sl").innerHTML=s.docs.map(d=>{const v=d.data();return `<div class="sight"><b>${esc(v.where)}</b>${v.comment?`<div>${esc(v.comment)}</div>`:""}<div class="mut">${ago(v.createdAt)}</div></div>`}).join("")},()=>{});
}

/* ---------- запуск ---------- */
async function init(){
 try{if("serviceWorker" in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});if(window.caches)caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))).catch(()=>{})}catch(e){}
 renderDeck();
 try{if(CFG_OK){const u=await authUser();uid=u.id;db=DB}else{uid=gk;db=DB}}catch(e){console.error(e)}
 if(!db){sig="";renderDeck();return}
 db.collection("posts").orderBy("createdAt","desc").limit(300).onSnapshot(s=>{const first=!loaded,old=posts;posts=s.docs.map(d=>({id:d.id,...d.data()}));loaded=true;renderDeck();if(sh)renderSheet();checkChanges(old,first);watchSightings()},()=>{loaded=true;renderDeck()},15000);
 db.collection("profiles").onSnapshot(s=>{profiles={};s.docs.forEach(d=>profiles[d.id]=d.data());bdg();if(sh==="account"||sh==="chats")renderSheet()},()=>{});
 loadJoined();
 if(me&&navigator.permissions&&navigator.permissions.query)navigator.permissions.query({name:"geolocation"}).then(r=>{if(r.state==="granted")getPos(p=>{me=p;SV("me",p);sig=""})}).catch(()=>{});
 if(uid)db.collection("chats").where("members","array-contains",uid).onSnapshot(s=>{const prev=new Set(myChats.filter(unread).map(c=>c.id));myChats=s.docs.map(d=>({id:d.id,...d.data()}));if(chatInit)myChats.filter(c=>unread(c)&&!prev.has(c.id)&&c.id!==curChat).forEach(c=>notify("Новое сообщение: "+c.postName));chatInit=true;bdg();if(sh==="chats")renderChats()},()=>{},8000);
 if(LOCAL)setTimeout(()=>toast("Режим на этом компьютере: объявления видны только в этом браузере."),4500);
 if(!LS("hint",false)){SV("hint",true);setTimeout(()=>toast("Вправо или ✓ — присоединиться к поиску. Влево или ✕ — пропустить."),800)}
}
init();
</script>
